<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AS | AryanStreams - Live High-Speed Player</title>
  <meta name="theme-color" content="#050814"/>
  <link rel="icon" href="/favicon.ico" sizes="48x48"/>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/assets/globals-SB89wHXU.css"/>
  <link rel="stylesheet" href="/assets/mobile-button-fix.css"/>
  <link rel="stylesheet" href="/assets/theme-as.css"/>
  <style>
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: Nunito, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .player-aspect {
      aspect-ratio: 16 / 9;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .server-btn {
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .server-btn.active {
      background-color: var(--primary, #3b82f6);
      color: #fff;
      border-color: var(--primary, #3b82f6);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="bg-[#0a0a0f] text-foreground">
  <!-- Top Bar -->
  <header class="border-b border-border/40 bg-surface/80 backdrop-blur sticky top-0 z-40">
    <div class="container mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <a id="backBtn" href="/" class="p-2 rounded-lg bg-surface-secondary hover:bg-surface-tertiary text-muted-foreground hover:text-foreground transition-all shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </a>
        <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-semibold bg-red-600/20 text-red-400 border border-red-500/30 shrink-0">
            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>LIVE
          </span>
          <h1 id="matchHeading" class="font-bold text-xs sm:text-base truncate max-w-[130px] xs:max-w-[180px] sm:max-w-md">Live Stream</h1>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <a href="/tv" class="as-tv-pill inline-flex items-center gap-1 px-2.5 sm:px-3 py-1.5 rounded-lg bg-surface-secondary hover:bg-surface-tertiary text-xs font-bold text-foreground border border-border/50 transition-all hover:border-primary/50 shadow-sm">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
          <span class="hidden xs:inline">📺 24/7 TV</span>
          <span class="xs:hidden">📺 TV</span>
        </a>
        <a href="https://discord.gg/aryanstreams" target="_blank" rel="noopener noreferrer" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-surface-secondary hover:bg-surface-tertiary text-xs border border-border/50 text-foreground inline-flex items-center gap-1" aria-label="Join Discord">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" class="text-sm">
            <path fill="currentColor" d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.04.03.04.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.03.01.06.02.09.01c1.72-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02M8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12m6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12"/>
          </svg>
          <span class="hidden sm:inline">Discord</span>
        </a>
        <button type="button" onclick="toggleFullscreen()" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-surface-secondary hover:bg-surface-tertiary text-xs border border-border/50 text-foreground">
          Fullscreen
        </button>
      </div>
    </div>
  </header>

  <!-- Player Stage -->
  <main class="container mx-auto px-4 py-4 sm:py-6 flex-1 flex flex-col items-center justify-center max-w-5xl">
    <!-- Video Frame -->
    <div class="w-full player-aspect relative border border-border/40 mb-4 bg-black">
      <iframe id="videoIframe" src="" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-black/90 text-center p-6 hidden">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary mb-3"></div>
        <p class="text-sm text-muted-foreground">Connecting to live stream server...</p>
      </div>
    </div>

    <!-- Server Control Bar -->
    <div class="w-full bg-surface border border-border/40 rounded-xl p-4 shadow-lg">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex flex-col">
          <span class="text-xs text-muted-foreground font-medium uppercase tracking-wider mb-2">Available Stream Servers:</span>
          <div id="serverList" class="flex flex-wrap gap-2">
            <!-- Server Buttons injected by JS -->
          </div>
        </div>
        <div class="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-border/30">
          <button type="button" onclick="reloadStream()" class="text-xs px-3 py-2 rounded-lg bg-surface-secondary hover:bg-surface-tertiary border border-border/50 text-foreground flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Reload Stream
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-muted-foreground border-t border-border/30">
    &copy; 2026 AS | AryanStreams. High-Speed Edge Sports Player.
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const initialSrc = params.get('src');
    const matchTitle = params.get('title') || 'Live Match';
    const matchId = params.get('id');
    const sport = params.get('sport') || '';

    if (matchTitle) {
      document.getElementById('matchHeading').textContent = matchTitle;
      document.title = matchTitle + ' | Live Player';
    }

    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      if (matchId) {
        backBtn.href = (sport ? '/match/' + sport + '/' : '/match/') + matchId;
      }
      backBtn.addEventListener('click', (e) => {
        if (window.history.length > 1) {
          e.preventDefault();
          window.history.back();
        }
      });
    }

    const iframe = document.getElementById('videoIframe');
    const serverList = document.getElementById('serverList');

    function setStreamUrl(url, name) {
      iframe.src = url;
      if (name) {
        document.getElementById('matchHeading').textContent = matchTitle + ' - ' + name;
      }
      document.querySelectorAll('.server-btn').forEach(btn => {
        if (btn.dataset.url === url) {
          btn.classList.add('active', 'bg-primary', 'text-white', 'border-primary');
          btn.classList.remove('bg-surface-secondary', 'text-foreground');
        } else {
          btn.classList.remove('active', 'bg-primary', 'text-white', 'border-primary');
          btn.classList.add('bg-surface-secondary', 'text-foreground');
        }
      });
    }

    function reloadStream() {
      const cur = iframe.src;
      iframe.src = '';
      setTimeout(() => { iframe.src = cur; }, 200);
    }

    function toggleFullscreen() {
      if (iframe.requestFullscreen) iframe.requestFullscreen();
      else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    }

    async function init() {
      let streams = [];

      if (matchId) {
        try {
          const cleanId = matchId.replace(/^(FS:|CUST:|TIM:|TOP:)/, '');
          const res = await fetch('/api/v1/match/' + encodeURIComponent(cleanId) + (sport ? '?sport=' + encodeURIComponent(sport) : ''));
          if (res.ok) {
            const data = await res.json();
            streams = data.custom_urls || [];
          }
        } catch (e) {}
      }

      if (initialSrc && !streams.some(s => s.url === initialSrc)) {
        streams.unshift({ id: 'primary', name: 'Server 1 (Direct)', url: initialSrc });
      }

      if (!streams.length) {
        // Fallback default stream
        streams.push({ id: 'default', name: 'Server 1: Premier Sports', url: initialSrc || 'https://bintv-sources.pages.dev/?id=aHR0cHM6Ly9laGdlbWJ4ZS5jZmQvYmludHYvMDFtcTZ3eGEtOTgxNg' });
      }

      serverList.innerHTML = streams.map((s, idx) => `
        <button type="button" data-url="${s.url}" onclick="setStreamUrl('${s.url}', '${s.name.replace(/'/g, "\\'")}')"
                class="server-btn px-3.5 py-2 rounded-lg text-xs font-semibold border border-border/50 bg-surface-secondary hover:bg-surface-tertiary transition-all ${idx === 0 ? 'active bg-primary text-white border-primary' : 'text-foreground'}">
          ${s.name || 'Server ' + (idx + 1)}
        </button>
      `).join('');

      // Play stream
      if (initialSrc) {
        const found = streams.find(s => s.url === initialSrc);
        setStreamUrl(initialSrc, found ? found.name : 'Server 1');
      } else {
        setStreamUrl(streams[0].url, streams[0].name);
      }
    }

    init();
  </script>
</body>
</html>
