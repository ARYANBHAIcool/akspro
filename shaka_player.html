<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AryanStreams Player Engine</title>
    <!-- Shaka Player CDN -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 12, 20, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(34, 197, 94, 0.2);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #f1f5f9;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        #unmute-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 20;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background 0.2s;
        }
        #unmute-btn:hover {
            transform: scale(1.05);
            background: rgba(34, 197, 94, 0.2);
            color: #fff;
        }
        #error-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 12, 20, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            gap: 12px;
            z-index: 15;
        }
        .error-title {
            color: #f87171;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .error-msg {
            color: #94a3b8;
            font-size: 12px;
            max-width: 380px;
            line-height: 1.4;
        }
        .retry-btn {
            background: #22c55e;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="video" autoplay controls playsinline></video>

        <button id="unmute-btn" onclick="unmuteVideo()">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            <span>Tap to Unmute</span>
        </button>

        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">Connecting broadcast stream...</div>
        </div>

        <div id="error-overlay">
            <div class="error-title">Stream Feed Unavailable</div>
            <div class="error-msg">This broadcast channel could not be reached right now. Please try reloading or choose another server above.</div>
            <button class="retry-btn" onclick="location.reload()">Reload Stream</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const loading = document.getElementById('loading-overlay');
        const errorOverlay = document.getElementById('error-overlay');
        const unmuteBtn = document.getElementById('unmute-btn');
        let player = null;

        function hideLoading() {
            if (loading) {
                loading.style.opacity = '0';
                setTimeout(() => { loading.style.display = 'none'; }, 300);
            }
        }

        function showError(err) {
            console.warn('[AryanShakaPlayer] Playback error:', err);
            hideLoading();
            if (errorOverlay) errorOverlay.style.display = 'flex';
        }

        function unmuteVideo() {
            if (video) {
                video.muted = false;
                if (unmuteBtn) unmuteBtn.style.display = 'none';
            }
        }

        async function initPlayer() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
                console.error('[AryanShakaPlayer] Browser not supported for Shaka Player');
                showError('Browser unsupported');
                return;
            }

            player = new shaka.Player(video);

            const params = new URLSearchParams(window.location.search);
            const mpd = params.get('mpd') || params.get('url') || params.get('src');
            const kid = params.get('kid');
            const key = params.get('key');
            const keys = params.get('keys');

            if (!mpd) {
                showError('No stream URL provided');
                return;
            }

            const clearKeys = {};
            if (kid && key) {
                clearKeys[kid.trim()] = key.trim();
            }
            if (keys) {
                keys.split(',').forEach(pair => {
                    const parts = pair.trim().split(':');
                    if (parts.length >= 2) {
                        clearKeys[parts[0].trim()] = parts[1].trim();
                    }
                });
            }

            const config = {
                streaming: {
                    bufferingGoal: 20,
                    rebufferingGoal: 2,
                    bufferBehind: 30,
                    lowLatencyMode: true,
                    retryParameters: {
                        maxAttempts: 4,
                        baseDelay: 1000,
                        backoffFactor: 2,
                        fuzzFactor: 0.5,
                        timeout: 10000
                    }
                },
                manifest: {
                    dash: {
                        ignoreMinBufferTime: true
                    }
                }
            };

            if (Object.keys(clearKeys).length > 0) {
                config.drm = { clearKeys: clearKeys };
            }

            player.configure(config);

            player.addEventListener('error', (e) => {
                const err = e.detail;
                if (err && err.severity === shaka.util.Error.Severity.CRITICAL) {
                    showError(err);
                }
            });

            video.addEventListener('playing', () => {
                hideLoading();
                if (video.muted && unmuteBtn) {
                    unmuteBtn.style.display = 'inline-flex';
                }
            });

            video.addEventListener('volumechange', () => {
                if (!video.muted && unmuteBtn) {
                    unmuteBtn.style.display = 'none';
                }
            });

            try {
                await player.load(mpd);
                try {
                    await video.play();
                } catch (playErr) {
                    // Autoplay policy prevented unmuted playback, mute and retry
                    console.log('[AryanShakaPlayer] Unmuted autoplay blocked, retrying muted...');
                    video.muted = true;
                    await video.play();
                    if (unmuteBtn) unmuteBtn.style.display = 'inline-flex';
                }
                hideLoading();
            } catch (loadErr) {
                showError(loadErr);
            }
        }

        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
