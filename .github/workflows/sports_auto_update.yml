name: AryanStreams Sports Data Auto Update

on:
  schedule:
    # Runs every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run AryanStreams Scraper
        run: node scripts/sports_scraper.js

      - name: Commit and Push Sports Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/Sports_data.json

          if git diff --cached --quiet; then
            echo "No sports updates to commit."
            exit 0
          fi

          git commit -m "⚡ Auto-update sports data feed [$(date -u '+%Y-%m-%d %H:%M:%S UTC')]"
          git push origin main
